[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "dlp-grokking"
version = "1.0.0"
description = "Grokking the Discrete Logarithm Problem: training, analysis, and reproduction code"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "David Vesterlund", affiliation = "Industrial Research at Vesterlund Ventures Holding AB"}]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "pandas>=2.0",
]

[project.optional-dependencies]
symbolic = ["pysr>=2.4"]

[tool.setuptools.packages.find]
where = ["src"]
