# SCRAMBLED Multi-Seed Verification + Train-Fraction Sweep
# Tests whether SCRAMBLED consistently groks faster than CRT-BOTH
# Also runs train-fraction sweep for H4 (N_crit for RAW vs CRT-BOTH)
project: dlp_grokking
base_seed: 42
jobs:
  # --- SCRAMBLED multi-seed (verify speed advantage) ---
  - name: SCRAMBLED_p113_s123
    type: crt
    variant: SCRAMBLED
    prime: 113
    model_id: M04
    n_layers: 2
    train_frac: 0.30
    epochs: 100000
    lr: 0.001
    wd_start: 0.05
    wd_step: 0.05
    wd_ramp_interval: 1000
    lr_drop_factor: 0.1
    eval_interval: 10
    checkpoint_interval: 2000
    early_stop_patience: 200
    early_stop_threshold: 0.99
    seed: 123

