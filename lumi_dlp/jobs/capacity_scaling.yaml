# Capacity Scaling Study — DLP grokking on p=113
# Models M01-M12 on p=113, 2 layers, WD auto-scaling
# Each job runs on a single GPU (1 task per GPU)
project: dlp_grokking
base_seed: 42
jobs:
  # --- Small models (M01-M06): fast grokking, ~minutes on MI250X ---
  - name: M01_p113_s42
    type: standard
    model_id: M01
    prime: 113
    n_layers: 2
    train_frac: 0.30
    epochs: 200000
    lr: 0.001
    wd_start: 0.05
    wd_step: 0.05
    wd_ramp_interval: 1000
    lr_drop_factor: 0.1
    eval_interval: 10
    checkpoint_interval: 2000
    early_stop_patience: 200
    early_stop_threshold: 0.99
    seed: 42

