# Tier 1 Critical Experiments for DLP Scaling Paper
# These are the experiments needed for submission:
# 1. Capacity sweep at matched 30% train fraction (clean capacity axis)
# 2. Data sweep M04 (5%-60% train fractions)
# 3. Multi-seed M04 (seeds 123, 456, 789)
# 4. Prime-order multi-seed (IID seeds 456, 789; OOD seeds 123, 456)
#
# All use RAW representation (not CRT-BOTH) since these are for the main paper.
project: dlp_grokking
base_seed: 42
jobs:
  # === Capacity sweep at matched 30% train fraction ===
  # All M01-M12 at 30% to get a clean capacity axis
  - name: M01_p113_f0.30_s42_matched
    type: standard
    prime: 113
    model_id: M01
    n_layers: 2
    train_frac: 0.30
    epochs: 500000
    lr: 0.001
    wd_start: 0.05
    wd_step: 0.05
    wd_ramp_interval: 1000
    lr_drop_factor: 1.0
    eval_interval: 100
    checkpoint_interval: 50000
    early_stop_patience: 100
    early_stop_threshold: 0.99
    seed: 42

