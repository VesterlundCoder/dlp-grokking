    lr: 0.001
    wd_start: 0.05
    wd_step: 0.05
    wd_ramp_interval: 1000
    lr_drop_factor: 0.1
    eval_interval: 50
    checkpoint_interval: 10000
    early_stop_patience: 100
    early_stop_threshold: 0.99
    seed: 42

