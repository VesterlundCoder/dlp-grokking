# Large-Prime Scaling — DLP on larger primes for capacity scaling
# M13-M18 use progressively larger primes
project: dlp_grokking
base_seed: 42
jobs:
  - name: M13_p257_s42
    type: standard
    model_id: M13
    prime: 257
    n_layers: 2
    train_frac: 0.40
    epochs: 1000000
    lr: 0.001
    wd_start: 0.05
    wd_step: 0.05
    wd_ramp_interval: 1000
    lr_drop_factor: 0.1
    eval_interval: 100
    checkpoint_interval: 10000
    early_stop_patience: 100
    early_stop_threshold: 0.99
    seed: 42

